# =========================================================
# Application
# =========================================================
spring.application.name=Pulse Attendance Backend
server.port=8080

# =========================================================
# PostgreSQL Database
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pulse_attendance
spring.datasource.username=postgres
spring.datasource.password=Postgres@123
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.com.pulse.attendance=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n

# =========================================================
# Jackson
# =========================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# =========================================================
# Profiles
# =========================================================
# Activate with:
# --spring.profiles.active=dev
# --spring.profiles.active=prod